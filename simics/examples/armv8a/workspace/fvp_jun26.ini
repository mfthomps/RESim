#
# ini file for ARMv8a FVP 
[ENV]
RESIM_TARGET=fvp
#CREATE_RESIM_PARAMS=YES
#RUN_FROM_SNAP=booted
PRE_INIT_SCRIPT=$RESIM_DIR/simics/simicsScripts/targets/armv8aJun26/anykey.simics

[fvp]
$host_name=mytarget
$bl1_image=$RESIM_IMAGE/fvp_arm_imagesJun26/bl1.bin
$fip_image=$RESIM_IMAGE/fvp_arm_imagesJun26/fip.bin
# TBD needs to point to an itb file.  See image_build
$kernel_image=$RESIM_IMAGE/fvp_arm_imagesJun26/image.itb
$mac_address_0="00:E1:27:0F:CA:A9"
#$mac_address_1="00:E1:27:0F:CA:A8"
#$mac_address_2="00:1A:A0:E1:1C:9F"

SIMICS_SCRIPT=armv8aJun26/fvp.simics
OS_TYPE=LINUX64
RESIM_PARAM=fvp64_jun26.param
RESIM_UNISTD_32=$RESIM_IMAGE/linux-3.4.99/arch/arm/include/asm/unistd.h
RESIM_UNISTD=$RESIM_IMAGE/linux64/arm64.tbl
RESIM_ROOT_PREFIX=$RESIM_IMAGE/fvp_arm_imagesJun26/ramdisk_fs
# Appliation types:  arm64 -- just 64-bit apps; armMixed -- 32 and 64 bit apps; arm32 -- 32 bit apps
PLATFORM=armMixed

